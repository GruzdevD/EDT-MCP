name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The MCP plugin is BUILT on 25: Tycho 5 needs Maven on JDK 21+, and tycho-surefire runs
      # the EDT 2026.2 platform bundles, which are Java 25. The bundle itself still compiles to
      # release 17 (mcp/bom/pom.xml), so one artifact keeps loading on EDT 2026.1.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      - name: Extract version from tag
        id: version
        run: |
          # tag: v1.26.0 → 1.26.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        working-directory: mcp
        run: |
          set -euo pipefail
          # From the pom, not pinned here: a hardcoded 4.0.5 stopped loading on the move to Tycho 5.
          TYCHO=$(sed -n 's|.*<tycho\.version>\(.*\)</tycho\.version>.*|\1|p' bom/pom.xml)
          test -n "$TYCHO"
          echo "tycho-versions-plugin: $TYCHO"
          mvn "org.eclipse.tycho:tycho-versions-plugin:$TYCHO:set-version" \
            -DnewVersion=${{ steps.version.outputs.version }} \
            --batch-mode --no-transfer-progress

          # tycho-versions-plugin rewrites pom versions only; for an eclipse-plugin
          # the version Tycho emits is read from Bundle-Version in MANIFEST.MF (and the
          # feature version), which set-version does NOT touch. Patch them from the tag
          # explicitly so the installed plugin reports a version matching the GitHub release
          # (e.g. tag v3.0.10 -> Bundle-Version 3.0.10.qualifier -> 3.0.10.<timestamp>),
          # instead of leaking the stale base into every release.
          MANIFEST=bundles/com.ditrix.edt.mcp.server/META-INF/MANIFEST.MF
          sed -i -E "s/^Bundle-Version: .*/Bundle-Version: ${{ steps.version.outputs.version }}.qualifier/" "$MANIFEST"
          FEATURE=features/com.ditrix.edt.mcp.server.feature/feature.xml
          sed -i -E "s/version=\"[0-9]+\.[0-9]+\.[0-9]+\.qualifier\"/version=\"${{ steps.version.outputs.version }}.qualifier\"/" "$FEATURE"
          test "$(grep -m1 'Bundle-Version:' "$MANIFEST")" = "Bundle-Version: ${{ steps.version.outputs.version }}.qualifier"

      - name: Maven build
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" clean verify --batch-mode --no-transfer-progress -T 1C

      - name: Build proxy
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          mvn -f proxy/pom.xml clean verify --batch-mode --no-transfer-progress
          cp proxy/target/edt-mcp-proxy-*.jar "edt-mcp-proxy-v${{ steps.version.outputs.version }}.jar"

      - name: Package archive
        run: |
          cd mcp/repositories/com.ditrix.edt.mcp.server.repository/target/repository
          zip -r "$GITHUB_WORKSPACE/MCP-EDT.v${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MCP-EDT v${{ steps.version.outputs.version }}
          files: |
            MCP-EDT.v*.zip
            edt-mcp-proxy-v*.jar
          generate_release_notes: true
