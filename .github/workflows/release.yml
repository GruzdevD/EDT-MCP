name: Release

# NOTE: releases build on the DEFAULT branch (master), NOT on the tag, because the
# tag ref cannot see the GitHub Actions p2 cache that lives on master. On a cold
# (direct tag) build Tycho re-resolves the whole p2 target platform online, and
# 1C has REMOVED com._1c.g5.aef2 from the public p2 2026.2 feed (verified: absent
# from artifacts.jar, direct jar 404), so validate-classpath fails with
# "bundleLocation can't be null for artifact ... aef2". Building on master reuses
# the warm cache where aef2 is already materialized. The tag is created at the end
# purely as a release marker; it triggers none of this workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 3.0.11 (no v prefix)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The MCP plugin is BUILT on 25: Tycho 5 needs Maven on JDK 21+, and tycho-surefire runs
      # the EDT 2026.2 platform bundles, which are Java 25. The bundle itself still compiles to
      # release 17 (mcp/bom/pom.xml), so one artifact keeps loading on EDT 2026.1.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      - name: Set version from input
        working-directory: mcp
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # tycho-versions-plugin rewrites pom versions only; for an eclipse-plugin the version
          # Tycho emits is read from Bundle-Version in MANIFEST.MF (and the feature version), which
          # set-version does NOT touch. Patch them explicitly so the installed plugin reports exactly
          # the released version (e.g. 3.0.11), final (no .qualifier) so validate-version passes.
          TYCHO=$(sed -n 's|.*<tycho\.version>\(.*\)</tycho\.version>.*|\1|p' bom/pom.xml)
          echo "tycho-versions-plugin: $TYCHO"
          mvn "org.eclipse.tycho:tycho-versions-plugin:$TYCHO:set-version" \
            -DnewVersion="$VERSION" \
            --batch-mode --no-transfer-progress
          MANIFEST=bundles/com.ditrix.edt.mcp.server/META-INF/MANIFEST.MF
          sed -i -E "s/^Bundle-Version: .*/Bundle-Version: $VERSION/" "$MANIFEST"
          FEATURE=features/com.ditrix.edt.mcp.server.feature/feature.xml
          sed -i -E "s/version=\"[0-9]+\.[0-9]+\.[0-9]+.qualifier\"/version=\"$VERSION\"/" "$FEATURE"
          test "$(grep -m1 'Bundle-Version:' "$MANIFEST")" = "Bundle-Version: $VERSION"

      - name: Maven build
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" clean verify --batch-mode --no-transfer-progress -T 1C

      - name: Build proxy
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          mvn -f proxy/pom.xml clean verify --batch-mode --no-transfer-progress
          cp proxy/target/edt-mcp-proxy-*.jar "edt-mcp-proxy-v${{ inputs.version }}.jar"

      - name: Package archive
        run: |
          cd mcp/repositories/com.ditrix.edt.mcp.server.repository/target/repository
          zip -r "$GITHUB_WORKSPACE/MCP-EDT.v${{ inputs.version }}.zip" .

      - name: Create GitHub Release and tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: MCP-EDT v${{ inputs.version }}
          target_commitish: master
          files: |
            MCP-EDT.v*.zip
            edt-mcp-proxy-v*.jar
          generate_release_notes: true
